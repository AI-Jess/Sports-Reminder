name: Daily reminder

# Every morning: posts the lineup to Discord and saves the message to the
# `messages` branch for the iPhone Shortcut to pick up and text.
on:
  schedule:
    # GitHub sometimes skips or delays scheduled runs, so this is scheduled
    # three times; only the first one that runs each day does anything.
    # 10:13 / 11:13 / 12:13 UTC = 5:13 / 6:13 / 7:13 AM Central (CDT),
    # one hour earlier in winter — all before the phone's 8 AM Shortcut.
    # (The pregame job, every 15 min from ~10 AM, is a further backup.)
    - cron: "13 10,11,12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Test date(s) YYYYMMDD, space-separated (blank = today)"
        required: false
        default: ""
      post:
        description: "Post to Discord"
        type: boolean
        default: true

permissions:
  contents: write

# Shares the messages branch with the pregame job; never run both at once.
concurrency:
  group: messages-branch
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: messages
          path: out

      - name: Check games
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          flags="--write"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            flags="$flags --post --once"
          else
            # Manual runs: post only if ticked; show every game ESPN listed.
            [ "${{ inputs.post }}" = "true" ] && flags="$flags --post"
            flags="$flags --debug"
          fi
          out=$(python3 check_games.py ${{ inputs.date }} $flags 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # Summary note skips the per-game debug lines (notes are capped at 4,096 chars).
          esc=$(printf '%s' "$out" | grep -v '^  \[' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Result::$esc"

      - name: Publish for the Shortcut
        run: |
          cd out
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Messages $(date -u +%F)"
          git push -q
