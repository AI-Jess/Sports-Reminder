name: Preview reminder

# Run from the Actions tab: pick a date to see what the Shortcut would send.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates to check, space-separated YYYYMMDD (blank = today)"
        required: false
        default: ""

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preview
        run: |
          dates="${{ inputs.dates }}"
          [ -z "$dates" ] && dates=$(TZ=America/Chicago date +%Y%m%d)
          for d in $dates; do
            out=$(python check_games.py "$d" --debug 2>&1)
            echo "$out"
            # Also surface each result as an annotation so it shows on the run page.
            esc=$(printf '%s' "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Preview $d::$esc"
          done
